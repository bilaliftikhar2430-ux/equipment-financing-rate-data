name: Update Rate Data

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate rate-report.json from live data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: node scripts/generate-report.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rate-report.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update rate data [automated]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish new Zenodo version
        if: steps.commit.outputs.changed == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: node scripts/zenodo-deposit.mjs

      - name: Commit updated Zenodo deposition id
        if: steps.commit.outputs.changed == 'true'
        run: |
          git add .zenodo-deposition-id
          git diff --cached --quiet || git commit -m "Update Zenodo deposition id [automated]"
          git push
